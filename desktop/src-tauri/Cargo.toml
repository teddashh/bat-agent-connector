[package]
name = "better-agent-dashboard"
version = "0.1.0"
description = "Better Agent Dashboard desktop client"
authors = ["Better Agent Dashboard contributors"]
edition = "2021"
rust-version = "1.98"
license = "MIT"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.2"
tauri-plugin-opener = "=2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
regex = "1"
zeroize = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
