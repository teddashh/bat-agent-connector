name: desktop

on:
  pull_request:
    paths: ["desktop/**", "src/bat_agent_connector/dashboard/**", ".github/workflows/desktop.yml"]
  push:
    branches: [main]
    paths: ["desktop/**", "src/bat_agent_connector/dashboard/**", ".github/workflows/desktop.yml"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundle: deb
          - os: windows-latest
            bundle: nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - name: Linux native build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run build:all
      - name: Check generated browser assets
        run: git diff --exit-code -- ../src/bat_agent_connector/dashboard
      - run: npm test
      - name: Shared browser and native-transport UI tests
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium && npm run test:ui
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Package app (unsigned validation artifact)
        run: npm run tauri -- build --bundles ${{ matrix.bundle }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-${{ runner.os }}-unsigned
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
